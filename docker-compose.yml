services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: semantic-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    expose:
      - "8000"
    networks:
      - internal

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: semantic-bot
    env_file:
      - .env
    environment:
      HOST_PROC: /host_proc
      HOST_SYS: /host_sys
      AI_URL: http://ai:8000
      LAMP_STATE_FILE: /data/lamp_state.json
      STRIP_SERVICE_URL: http://strip-service:8010
    volumes:
      - notes_data:/data
      - /proc:/host_proc:ro
      - /sys:/host_sys:ro
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    depends_on:
      ai:
        condition: service_healthy
      strip-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  strip-service:
    build:
      context: ./strip_service
      dockerfile: Dockerfile
    container_name: strip-service
    environment:
      STRIP_ADDRESS: ${STRIP_ADDRESS:-BE:68:E6:00:53:2D}
      STRIP_NAME: ${STRIP_NAME:-ELK-BLEDDM 8C}
    volumes:
      - /var/run/dbus:/var/run/dbus
    privileged: true
    restart: unless-stopped
    expose:
      - "8010"
    networks:
      - internal

volumes:
  notes_data:

networks:
  internal:
    driver: bridge
