services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: semantic-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: semantic-bot
    env_file:
      - .env
    environment:
      HOST_PROC: /host_proc
      HOST_SYS: /host_sys
      AI_URL: http://127.0.0.1:8000
      LAMP_STATE_FILE: /data/lamp_state.json
      STRIP_SERVICE_URL: http://127.0.0.1:8010
      ESP32_URL: ${ESP32_URL:-http://192.168.1.211}
      ROOM_I2C_DEVICE: ${ROOM_I2C_DEVICE:-/dev/i2c-1}
      METEO_LATITUDE: ${METEO_LATITUDE:-39.4699}
      METEO_LONGITUDE: ${METEO_LONGITUDE:--0.3763}
      STATUS_DAY_BRIGHTNESS: ${STATUS_DAY_BRIGHTNESS:-128}
      STATUS_NIGHT_BRIGHTNESS: ${STATUS_NIGHT_BRIGHTNESS:-1}
    volumes:
      - notes_data:/data
      - /proc:/host_proc:ro
      - /sys:/host_sys:ro
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/i2c-1:/dev/i2c-1
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 89:* rmw"
    depends_on:
      ai:
        condition: service_healthy
      strip-service:
        condition: service_started
    restart: unless-stopped
    network_mode: host

  strip-service:
    build:
      context: ./strip_service
      dockerfile: Dockerfile
    container_name: strip-service
    environment:
      STRIP_ADDRESS: ${STRIP_ADDRESS:-BE:68:E6:00:53:2D}
      STRIP_NAME: ${STRIP_NAME:-ELK-BLEDDM 8C}
    volumes:
      - /var/run/dbus:/var/run/dbus
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    networks:
      - internal

volumes:
  notes_data:

networks:
  internal:
    driver: bridge
